# @package _global_
#
# AnticiPose B5 (anticipose) obs config.
# Extends base with predicted_wrench (30 dims = H=5 x 6D wrench).
# Per-step actor obs: 115 + 30 = 145 dims.
# With history_length=5: 145 x 5 = 725 dims total.

obs:
  use_phase: True
  obs_dict:
    actor_obs: [
      # base_lin_vel,
      base_ang_vel,
      projected_gravity,
      command_lin_vel,
      command_ang_vel,
      command_stand,
      command_waist_dofs,
      command_base_height,
      ref_upper_dof_pos,
      dof_pos,
      dof_vel,
      actions,
      predicted_wrench,
    ]

    critic_obs: [
      base_orientation,
      base_lin_vel,
      base_ang_vel,
      projected_gravity,
      command_lin_vel,
      command_ang_vel,
      command_stand,
      command_waist_dofs,
      command_base_height,
      ref_upper_dof_pos,
      dof_pos,
      dof_vel,
      actions,
      current_wrench,
    ]

  history_length:
    actor_obs: 5
    critic_obs: 1

  obs_scales: {
    base_orientation: 1.0,
    base_lin_vel: 2.0,
    base_ang_vel: 0.25,
    projected_gravity: 1.0,
    command_lin_vel: 1.0,
    command_ang_vel: 1.0,
    command_stand: 1.0,
    command_waist_dofs: 1.0,
    command_base_height: 2.0,
    ref_upper_dof_pos: 1.0,
    dof_pos: 1.0,
    dof_vel: 0.05,
    actions: 1.0,
    sin_phase: 1.0,
    cos_phase: 1.0,
    left_ee_apply_force: 0.1,
    right_ee_apply_force: 0.1,
    history_actor: 1.0,
    predicted_wrench: 0.1,
    current_wrench: 0.1,
  }

  add_noise: False
  noise_scales: {
    base_orientation: 0.0,
    base_lin_vel: 0.0,
    base_ang_vel: 0.0,
    projected_gravity: 0.0,
    command_lin_vel: 0.0,
    command_ang_vel: 0.0,
    command_stand: 0.0,
    command_waist_dofs: 0.0,
    command_base_height: 0.0,
    ref_upper_dof_pos: 0.0,
    dof_pos: 0.01,
    dof_vel: 0.1,
    actions: 0.0,
    sin_phase: 0.0,
    cos_phase: 0.0,
    left_ee_apply_force: 0.0,
    right_ee_apply_force: 0.0,
    history_actor: 0.0,
    predicted_wrench: 0.0,
    current_wrench: 0.0,
  }

  obs_dims:
    - base_orientation: 4
    - base_lin_vel: 3
    - base_ang_vel: 3
    - projected_gravity: 3
    - command_lin_vel: 2
    - command_ang_vel: 1
    - command_stand: 1
    - command_waist_dofs: 3
    - command_base_height: 1
    - ref_upper_dof_pos: ${robot.upper_body_actions_dim}
    - dof_pos: ${robot.dof_obs_size}
    - dof_vel: ${robot.dof_obs_size}
    - actions: ${robot.dof_obs_size}
    - sin_phase: 1
    - cos_phase: 1
    - left_ee_apply_force: 3
    - right_ee_apply_force: 3
    - predicted_wrench: 30
    - current_wrench: 6
